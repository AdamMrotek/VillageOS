AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: VillageOS FastAPI service on Lambda + API Gateway

Parameters:
  SupabaseUrl:
    Type: String
  SupabasePublishableKey:
    Type: String
  SupabaseSecretKey:
    Type: String
    NoEcho: true
  OpenAiApiKey:
    Type: String
    NoEcho: true
    Default: ''
  GroqApiKey:
    Type: String
    NoEcho: true
    Default: ''
  LlmProvider:
    Type: String
    Default: openai
    AllowedValues: [openai, groq]
  AllowedOrigins:
    Type: String
    Default: http://localhost:3000
  # Browser origins allowed to upload covers straight to S3. Kept separate from
  # AllowedOrigins so the cover bucket can tolerate localhost for dev uploads
  # without loosening the API's CORS.
  CoverCorsOrigins:
    Type: String
    Default: http://localhost:3000

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024
    Runtime: python3.12
    Architectures: [arm64]
  HttpApi:
    # Cost guard: cap requests at 5/sec sustained, 10 burst across the whole API
    RouteSettings:
      '$default':
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda_handler.handler
      # Cost guard is enforced upstream by the HttpApi throttle (5 req/sec, 10 burst).
      # ReservedConcurrentExecutions would require an account-level concurrency quota > 10.
      # Lets the function presign uploads. Presigned POSTs inherit the signer's
      # IAM, so s3:PutObject on the cover bucket is all that's needed.
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub '${ProviderCoverBucket.Arn}/*'
      Environment:
        Variables:
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_PUBLISHABLE_KEY: !Ref SupabasePublishableKey
          SUPABASE_SECRET_KEY: !Ref SupabaseSecretKey
          OPENAI_API_KEY: !Ref OpenAiApiKey
          GROQ_API_KEY: !Ref GroqApiKey
          LLM_PROVIDER: !Ref LlmProvider
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          PROVIDER_COVER_BUCKET: !Ref ProviderCoverBucket
          PROVIDER_COVER_CDN_DOMAIN: !GetAtt ProviderCoverCdn.DomainName
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
        ApiProxy:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

  # Cost guard: cap log retention to 7 days so CloudWatch storage stays in free tier
  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ApiFunction}'
      RetentionInDays: 7

  # ---- Provider covers: private bucket, readable only through CloudFront (OAC) ----
  ProviderCoverBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:        # bucket stays fully private
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      CorsConfiguration:                     # browser uploads straight to S3 via presigned POST
        CorsRules:
          - AllowedMethods: [POST]
            AllowedOrigins: !Split [',', !Ref CoverCorsOrigins]
            AllowedHeaders: ['*']
            MaxAge: 3000

  ProviderCoverOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: villageos-provider-covers
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ProviderCoverCdn:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultCacheBehavior:
          TargetOriginId: ProviderCoverS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # AWS Managed-CachingOptimized
        Origins:
          - Id: ProviderCoverS3Origin
            DomainName: !GetAtt ProviderCoverBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt ProviderCoverOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''        # must be empty when using OAC

  ProviderCoverBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ProviderCoverBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadViaOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${ProviderCoverBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${ProviderCoverCdn.Id}'

  # Observability dashboard, built entirely from the structured JSON logs
  # (no custom metrics — see ADR-014). Widgets are Logs Insights queries over
  # the function's log group; redeploys with `sam deploy`.
  ApiDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: VillageOS-API
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "text",
              "x": 0, "y": 0, "width": 24, "height": 1,
              "properties": { "markdown": "# VillageOS API — extraction telemetry  ·  log-derived, region ${AWS::Region}" }
            },
            {
              "type": "log",
              "x": 0, "y": 1, "width": 12, "height": 6,
              "properties": {
                "title": "Extraction LLM latency (ms)",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "query": "SOURCE '/aws/lambda/${ApiFunction}' | filter event = \"extraction_completed\" | stats avg(llm_duration_ms) as avg_ms, pct(llm_duration_ms, 50) as p50_ms, pct(llm_duration_ms, 95) as p95_ms by bin(5m)"
              }
            },
            {
              "type": "log",
              "x": 12, "y": 1, "width": 12, "height": 6,
              "properties": {
                "title": "Requests by status code",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": true,
                "query": "SOURCE '/aws/lambda/${ApiFunction}' | filter event = \"request_completed\" | stats count(*) as requests by bin(5m), status"
              }
            },
            {
              "type": "log",
              "x": 0, "y": 7, "width": 12, "height": 6,
              "properties": {
                "title": "Token spend by model",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": true,
                "query": "SOURCE '/aws/lambda/${ApiFunction}' | filter event = \"extraction_completed\" | stats sum(total_tokens) as tokens by bin(1h), model"
              }
            },
            {
              "type": "log",
              "x": 12, "y": 7, "width": 12, "height": 6,
              "properties": {
                "title": "Extraction confidence",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "query": "SOURCE '/aws/lambda/${ApiFunction}' | filter event = \"extraction_completed\" | stats avg(confidence) as avg_conf, min(confidence) as min_conf by bin(1h)"
              }
            },
            {
              "type": "log",
              "x": 0, "y": 13, "width": 12, "height": 6,
              "properties": {
                "title": "Extractions per 5 min",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "query": "SOURCE '/aws/lambda/${ApiFunction}' | filter event = \"extraction_completed\" | stats count(*) as extractions by bin(5m)"
              }
            },
            {
              "type": "log",
              "x": 12, "y": 13, "width": 12, "height": 6,
              "properties": {
                "title": "Recent errors",
                "region": "${AWS::Region}",
                "view": "table",
                "query": "SOURCE '/aws/lambda/${ApiFunction}' | filter event = \"request_failed\" or event = \"extraction_failed\" | fields @timestamp, request_id, event, path | sort @timestamp desc | limit 20"
              }
            }
          ]
        }

Outputs:
  ApiUrl:
    Description: Base URL of the deployed API
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  FunctionName:
    Description: Lambda function name
    Value: !Ref ApiFunction
  DashboardUrl:
    Description: CloudWatch dashboard for extraction telemetry
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/VillageOS-API'
  ProviderCoverCdnDomain:
    Description: CloudFront domain serving provider covers (set as PROVIDER_COVER_CDN_DOMAIN)
    Value: !GetAtt ProviderCoverCdn.DomainName
