# Type checking for the API service — run as `mypy` from apps/api (CI does).
# Pragmatic baseline, not --strict: untyped function bodies are still checked
# (check_untyped_defs), implicit Optional is banned, and stale ignores fail.
# Tighten incrementally rather than blanket-ignoring new errors.
[mypy]
python_version = 3.12
files = app, main.py, lambda_handler.py, tests, evals
plugins = pydantic.mypy

check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True

# Third-party packages that ship no type stubs.
[mypy-mangum.*]
ignore_missing_imports = True

[mypy-boto3.*]
ignore_missing_imports = True

[mypy-botocore.*]
ignore_missing_imports = True

[mypy-pythonjsonlogger.*]
ignore_missing_imports = True

# Pillow is an eval-only dependency (evals/extraction/run.py), imported lazily
# and not part of the deployed API, so it is absent from the CI typecheck env.
[mypy-PIL.*]
ignore_missing_imports = True
