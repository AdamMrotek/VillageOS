name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  web:
    name: Web (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -F @repo/web lint

      - name: Typecheck
        run: pnpm -F @repo/web exec tsc --noEmit

      - name: Test
        run: pnpm -F @repo/web test

      - name: Build
        run: pnpm build

  api:
    name: API (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          # Glob both files so the cache key busts whenever either the app lock
          # or the dev tooling changes (requirements-dev.txt includes requirements.txt).
          cache-dependency-path: apps/api/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Typecheck
        run: mypy

      - name: Run tests
        run: pytest

  e2e:
    name: E2E (Playwright + local Supabase)
    runs-on: ubuntu-latest
    # A hung Docker pull or web server must not burn hours of runner time.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      # playwright.config.ts boots the API via apps/api/.venv/bin/uvicorn —
      # same path as local runs, so the venv must exist before `playwright test`.
      - name: Set up API virtualenv
        working-directory: apps/api
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      # Pinned to the version the committed supabase/config.toml was written
      # against (signing_keys_path support). Never run `supabase init` here —
      # it would regenerate a default config without the signing key and the
      # API's JWKS-only validation would 401 everything.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      # Fresh stack: applies supabase/migrations + seed.sql, serves JWKS from
      # the committed local-only signing key. All keys are the CLI's shared
      # local defaults — no GitHub secrets involved.
      - name: Start local Supabase stack
        run: supabase start -x studio,imgproxy,edge-runtime,vector,logflare

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm --filter @repo/e2e exec playwright install --with-deps chromium

      # CI=true makes playwright.config.ts build and serve the production web
      # bundle (next build && next start) instead of the dev server.
      - name: Run e2e tests
        run: pnpm --filter @repo/e2e test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
