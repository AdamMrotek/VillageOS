name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AWS_REGION: eu-north-1

jobs:
  deploy:
    name: SAM build & deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        run: pytest

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gh-actions-deploy-api

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: SAM build
        run: sam build

      - name: SAM deploy
        run: |
          sam deploy \
            --stack-name villageos-api \
            --region "${AWS_REGION}" \
            --resolve-s3 \
            --s3-prefix villageos-api \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "SupabaseUrl=${{ vars.SUPABASE_URL }}" \
              "SupabasePublishableKey=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
              "SupabaseSecretKey=${{ secrets.SUPABASE_SECRET_KEY }}" \
              "OpenAiApiKey=${{ secrets.OPENAI_API_KEY }}" \
              "GroqApiKey=${{ secrets.GROQ_API_KEY }}" \
              "LlmProvider=${{ vars.LLM_PROVIDER }}" \
              "AllowedOrigins=${{ vars.ALLOWED_ORIGINS }}" \
              "CoverCorsOrigins=${{ vars.COVER_CORS_ORIGINS }}"

      - name: Output API URL
        run: |
          aws cloudformation describe-stacks \
            --stack-name villageos-api \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text
